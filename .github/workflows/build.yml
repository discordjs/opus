name: Build
on:
  push:
    branches:
      - main
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    name: Build node ${{ matrix.node }} on ${{ matrix.os }}
    if: >-
      github.event_name != 'push' ||
      !startsWith(github.event.head_commit.message, 'chore: release v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [
          macos-15,
          macos-15-intel,
          macos-26,
          ubuntu-22.04,
          ubuntu-22.04-arm,
          ubuntu-24.04,
          ubuntu-24.04-arm,
          ubuntu-26.04,
          ubuntu-26.04-arm,
          windows-2022,
          windows-2025,
          windows-11-arm
        ]
        node: [22, 24, 26]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node v${{ matrix.node }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          npm_config_build_from_source: true

      - name: Package prebuild
        run: pnpm run build

      - name: Run tests
        run: pnpm test

  build_debian:
    name: Build node ${{ matrix.node }} on ${{ matrix.os }} (debian ${{ matrix.debian }})
    if: >-
      github.event_name != 'push' ||
      !startsWith(github.event.head_commit.message, 'chore: release v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        node: [22, 24, 26]
        debian: [bookworm, trixie]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Setup container
        run: |
          docker run --name runner --rm -it -d -v $PWD:/node-opus -w /node-opus node:${{ matrix.node }}-${{ matrix.debian }}

      - name: Setup env
        run: docker exec runner sh -c 'npm install -g "$(node -p "require(\"./package.json\").packageManager")"'

      - name: Install dependencies
        run: docker exec -e npm_config_build_from_source=true runner pnpm install --frozen-lockfile

      - name: Package prebuild
        run: docker exec runner pnpm run build

      - name: Run tests
        run: docker exec runner pnpm test

      - name: Stop container
        run: docker rm -f runner

  build_musl:
    name: Build node ${{ matrix.node }} on ${{ matrix.os }} (musl)
    if: >-
      github.event_name != 'push' ||
      !startsWith(github.event.head_commit.message, 'chore: release v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        node: [22, 24, 26]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: true

      # Workaround https://github.com/actions/runner/issues/801
      - name: Setup container
        run: |
          docker run --name runner --rm -it -d -v $PWD:/node-opus -w /node-opus node:${{ matrix.node }}-alpine

      - name: Setup env with Node v${{ matrix.node }}
        run: |
          docker exec runner apk add --update
          docker exec runner apk add --no-cache ca-certificates git curl build-base python3 g++ make
          docker exec runner sh -c 'npm install -g "$(node -p "require(\"./package.json\").packageManager")"'

      - name: Install dependencies
        run: docker exec -e npm_config_build_from_source=true runner pnpm install --frozen-lockfile

      - name: Package prebuild
        run: docker exec runner pnpm run build

      - name: Run tests
        run: docker exec runner pnpm test

      - name: Stop container
        run: docker rm -f runner
