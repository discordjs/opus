name: Prebuild
on:
  release:
    types: [published]
jobs:
  build:
    name: Prebuild node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [
          macos-15,
          macos-15-intel,
          ubuntu-22.04,
          ubuntu-22.04-arm,
          ubuntu-24.04,
          ubuntu-24.04-arm,
          windows-2022,
          windows-11-arm
        ]
        node: [22, 24, 26]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node v${{ matrix.node }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          npm_config_build_from_source: true

      - name: Package prebuild
        run: pnpm run build

      - name: Upload prebuild asset
        uses: icrawl/action-artifact@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path: 'build/stage/**/*.tar.gz'

  build_debian:
    name: Prebuild node ${{ matrix.node }} on ${{ matrix.os }} (debian ${{ matrix.debian }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        node: [22, 24, 26]
        debian: [bookworm, trixie]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Setup container
        run: |
          docker run --name runner --rm -it -d -v $PWD:/node-opus -w /node-opus node:${{ matrix.node }}-${{ matrix.debian }}

      - name: Setup env
        run: docker exec runner sh -c 'npm install -g "$(node -p "require(\"./package.json\").packageManager")"'

      - name: Install dependencies
        run: docker exec -e npm_config_build_from_source=true runner pnpm install --frozen-lockfile

      - name: Package prebuild
        run: docker exec runner pnpm run build

      - name: Stop container
        run: docker rm -f runner

      - name: Upload prebuild asset
        uses: icrawl/action-artifact@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path: 'build/stage/**/*.tar.gz'

  build_musl:
    name: Prebuild node ${{ matrix.node }} on ${{ matrix.os }} (musl)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        node: [22, 24, 26]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: true

      # Workaround https://github.com/actions/runner/issues/801
      - name: Setup container
        run: |
          docker run --name runner --rm -it -d -v $PWD:/node-opus -w /node-opus node:${{ matrix.node }}-alpine

      - name: Setup env with Node v${{ matrix.node }}
        run: |
          docker exec runner apk add --update
          docker exec runner apk add --no-cache ca-certificates git curl build-base python3 g++ make
          docker exec runner sh -c 'npm install -g "$(node -p "require(\"./package.json\").packageManager")"'

      - name: Install dependencies
        run: docker exec -e npm_config_build_from_source=true runner pnpm install --frozen-lockfile

      - name: Package prebuild
        run: docker exec runner pnpm run build

      - name: Stop container
        run: docker rm -f runner

      - name: Upload prebuild asset
        uses: icrawl/action-artifact@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path: 'build/stage/**/*.tar.gz'
